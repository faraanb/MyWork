<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="isc-app" content="1">
  <title>iPhone Stock Checker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='2' width='16' height='28' rx='4' fill='%2334c759'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>iPhone Stock Checker</h1>
      <p class="sub">Live in-store pickup availability from Apple Stores and AT&amp;T stores, updated automatically.</p>
    </div>
  </header>

  <main class="wrap">
    <form id="controls" class="panel" autocomplete="off">
      <div class="row">
        <label>Country
          <select id="country"></select>
        </label>
        <label class="grow">Location
          <input id="location" type="text" placeholder="ZIP code" required>
        </label>
        <label class="grow">Model
          <select id="model" disabled><option>Loading…</option></select>
        </label>
      </div>

      <div class="filters">
        <fieldset id="f-color"><legend>Finish</legend><div class="chips"></div></fieldset>
        <fieldset id="f-capacity"><legend>Storage</legend><div class="chips"></div></fieldset>
        <fieldset id="f-carrier"><legend>Carrier</legend><div class="chips"></div></fieldset>
        <fieldset id="f-retailer"><legend>Stores</legend><div class="chips">
          <button type="button" class="chip" data-retailer="apple" aria-pressed="true">Apple Store</button>
          <button type="button" class="chip" data-retailer="att" aria-pressed="false">AT&amp;T</button>
        </div></fieldset>
      </div>

      <div class="row actions">
        <button id="check" type="submit" class="primary">Check availability</button>
        <label class="inline">
          <input id="auto" type="checkbox"> Auto-refresh every
          <select id="interval">
            <option value="60">1 min</option>
            <option value="120" selected>2 min</option>
            <option value="300">5 min</option>
            <option value="600">10 min</option>
          </select>
        </label>
        <label class="inline"><input id="notify" type="checkbox"> Alert me when stock appears</label>
        <label class="inline"><input id="onlyAvail" type="checkbox"> Only show stores with stock</label>
      </div>

      <div class="row extras">
        <label class="grow"><span>Phone alerts via <a href="https://ntfy.sh" target="_blank" rel="noopener">ntfy</a> (optional)</span>
          <input id="ntfy" type="text" placeholder="Your ntfy topic, e.g. my-iphone-alerts-7f3k" spellcheck="false">
        </label>
      </div>
      <div id="mode" class="mode"></div>
    </form>

    <section id="status" class="status" aria-live="polite"></section>
    <section id="results"></section>
  </main>

  <footer class="wrap foot">
    Not affiliated with Apple or AT&amp;T. Data comes from the public Apple Store and AT&amp;T websites and can lag a few minutes behind real stock.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
